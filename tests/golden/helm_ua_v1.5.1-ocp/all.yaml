# Source: ua-ocp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-ua
  namespace: default
  labels:
    app.kubernetes.io/name: ""
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ua
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ""
      app.kubernetes.io/instance: test-release
      app.kubernetes.io/component: ua
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ""
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/component: ua
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uac-ua
          image: "stonebranch/universal-agent:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7878
            - containerPort: 7887
          envFrom:
            - configMapRef:
                name: test-release-ua-configmap
          env:
            - name: UAGTLSSNIHOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: 'test-release-uasni-configmap'
                  key: UAGTLSSNIHOSTNAME
          volumeMounts:                                                                       
              - name: oms-storage
                mountPath: "/var/opt/universal/spool/oms"
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pgrep -x omssrv >/dev/null ||
                  pgrep -x ubroker >/dev/null ||
                  pgrep -x uagsrv >/dev/null ||
                  pgrep -x uemsrv >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pgrep -x omssrv >/dev/null ||
                  pgrep -x ubroker >/dev/null ||
                  pgrep -x uagsrv >/dev/null ||
                  pgrep -x uemsrv >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10            
      volumes:
        - name: oms-storage
          persistentVolumeClaim:
            claimName: test-release-ua-pvc
