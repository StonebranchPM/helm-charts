        app.kubernetes.io/component: uc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/uc/resources/metrics"
        checksum/config: 31abf933f04dd82bda3f94eca1a36d4de5e41665b232ce990a575cdc219103f1
        checksum/passwords: a860c5fa04a2db1129bec783bdb6d54f179dd519513680625b9441a9d66df21b
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: test-release-secret-repo
      containers:
        - name: uc-container
          image: "your-repo/uc:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
