# Source: uc-ocp/templates/hostname-appendum.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: test-release-oms-route-cm-patch
  namespace: default
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: test-release-cm-patcher
      restartPolicy: Never
      containers:
        - name: patcher
          image: bitnami/kubectl:latest
          command: ["/bin/bash","-lc"]
          env:
            - name: NS
              value: "default"
            - name: ROUTE_NAME
              value: "test-release-oms-route"
            - name: CONFIGMAP_NAME
              value: "test-release-oms-configmap"
          args:
            - |
              set -euo pipefail
              echo "Waiting for Route ${ROUTE_NAME} in ${NS} to be Admitted..."
              for i in {1..90}; do
                HOST="$(kubectl -n "${NS}" get route "${ROUTE_NAME}" -o jsonpath='{.status.ingress[0].host}' 2>/dev/null || true)"
                ADMIT="$(kubectl -n "${NS}" get route "${ROUTE_NAME}" -o jsonpath='{.status.ingress[0].conditions[?(@.type=="Admitted")].status}' 2>/dev/null || true)"
                if [[ -n "${HOST}" && "${ADMIT}" == "True" ]]; then
                  echo "Route admitted with host: ${HOST}"
                  break
                fi
                sleep 2
              done
              if [[ -z "${HOST:-}" ]]; then
                echo "ERROR: Route host not available"; exit 1
              fi
              SNI="443@${HOST}:${HOST}"
              echo "Patching ${CONFIGMAP_NAME} data.UAGTLSSNIHOSTNAME=${SNI}"
              # Merge-patch ONLY that key
              kubectl -n "${NS}" patch configmap "${CONFIGMAP_NAME}" --type merge \
                -p "{\"data\":{\"UAGTLSSNIHOSTNAME\":\"${SNI}\"}}"
---
