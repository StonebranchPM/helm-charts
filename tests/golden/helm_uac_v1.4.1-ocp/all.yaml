# templates/oms-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-oms
  namespace: default
  labels:
    app.kubernetes.io/name: uc-ocp
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: 7.9.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uc-ocp
      app.kubernetes.io/instance: test-release
      app.kubernetes.io/component: oms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uc-ocp
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/component: oms
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uac-oms
          image: "stonebranch/universal-agent:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7878
            - containerPort: 7887
          envFrom:
            - configMapRef:
                name: test-release-oms-configmap
          volumeMounts:
            - name: oms-storage
              mountPath: "/var/opt/universal/spool/oms"
          resources:
            limits:
              cpu: 1m
              memory: 128Mi
            requests:
              cpu: 0.1m
              memory: 128Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pgrep -x omssrv >/dev/null ||
                  pgrep -x ubroker >/dev/null ||
                  pgrep -x uagsrv >/dev/null ||
                  pgrep -x uemsrv >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pgrep -x omssrv >/dev/null ||
                  pgrep -x ubroker >/dev/null ||
                  pgrep -x uagsrv >/dev/null ||
                  pgrep -x uemsrv >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: oms-storage
          persistentVolumeClaim:
            claimName: 'test-release-oms-pvc'
