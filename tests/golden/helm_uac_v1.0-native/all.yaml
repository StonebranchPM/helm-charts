# templates/uc-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: 'test-release-uc'
  namespace: default
  labels:
    app.kubernetes.io/name: uc-native
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: 7.9.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: uc
spec:
  replicas: 1
  serviceName: test-release-uc-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: uc-native
      app.kubernetes.io/instance: test-release
      app.kubernetes.io/component: uc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uc-native
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/component: uc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/uc/resources/metrics"
        checksum/config: bdd5a3cc29e087b0e37dff5675a294a58f42ce084facd212d8e30cbc78650d4c
        checksum/passwords: d2431c197fffd671b3c2fb8dec9734f4780c655c403e5895117b0b499a9d4eb0
    spec:
      serviceAccountName: default
      securityContext: {}
      imagePullSecrets:
        - name: test-release-secret-repo
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: uc-container
          image: ":"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: test-release-uc-configmap
          env:
            - name: UC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password
            - name: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password-truststore
            - name: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD_ENCRYPTED
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD_ENCRYPTED
            - name: UC_KEYMANAGER_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password-keystore
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # ~5 minutes

          readinessProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
