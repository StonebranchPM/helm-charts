  UAGTRANSIENT: "yes"
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  UAGAUTOSTART: "yes"
  
  
  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  OMSAUTOSTART: "no"
---
# Source: universal-agent/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-release-ua-pvc
  namespace: default
  labels:
    app.kubernetes.io/name: ""
    app.kubernetes.io/instance: test-release
