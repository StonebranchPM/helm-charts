# Source: ua-aks/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: test-release-ua-service
  namespace: default
  labels:
    app.kubernetes.io/name: ""
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ua-service
spec:
  selector:
    app.kubernetes.io/name: ""
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/component: ua
