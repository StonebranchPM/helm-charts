    - name: udm
      port: 7887
      targetPort: 7887
      protocol: TCP
---
# Source: ua-aks/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-ua
  namespace: default
  labels:
    app.kubernetes.io/name: ""
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ua
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ""
      app.kubernetes.io/instance: test-release
      app.kubernetes.io/component: ua
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ""
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/component: ua
    spec:
      serviceAccountName:     
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uac-ua
          image: "stonebranch/universal-agent:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7878
            - containerPort: 7887
          envFrom:
            - configMapRef:
                name: test-release-ua-configmap
          volumeMounts:
            - name: oms-storage
              mountPath: "/var/opt/universal/spool/oms"
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pgrep -x omssrv >/dev/null ||
                  pgrep -x ubroker >/dev/null ||
                  pgrep -x uagsrv >/dev/null ||
                  pgrep -x uemsrv >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pgrep -x omssrv >/dev/null ||
                  pgrep -x ubroker >/dev/null ||
                  pgrep -x uagsrv >/dev/null ||
                  pgrep -x uemsrv >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: oms-storage
          persistentVolumeClaim:
            claimName: test-release-ua-pvc
---
# Source: ua-aks/templates/gateway.yaml
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: 'test-release-ua-gateway'
  namespace: "default"
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 15446
      name: udm-tls
      protocol: TLS
    tls:
      mode: PASSTHROUGH
    hosts:
    - ""
---
# Source: ua-aks/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: test-release-ua-vs
  namespace: default
spec:
  gateways: ["test-release-ua-gateway"]
  hosts: [""]
  tls:
  - match:
    - port: 446
      sniHosts: [""]
    route:
    - destination:
        host: 'test-release-ua-service.default.svc.cluster.local'
        port:
          number: 7887
      weight: 100
