# Source: uc-aks/templates/uc-deployment.yaml
# templates/uc-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 'test-release-uc'
  namespace: default
  labels:
    app.kubernetes.io/name: uc-aks
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: 7.9.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: uc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uc-aks
      app.kubernetes.io/instance: test-release
      app.kubernetes.io/component: uc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uc-aks
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/component: uc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/uc/resources/metrics"
        sidecar.istio.io/inject: "true"
        checksum/config: a142657ec36002498213d7c865a1f9c9ad66ace3f98c38f690b4cffffd575963
        checksum/passwords: 40b0321cf5dbfe65b9b461cd0b07133fb86fd4d129c6ee1a50f479b56d696c96
    spec:
      serviceAccountName: default
      securityContext: {}
      imagePullSecrets:
        - name: test-release-secret-repo
      nodeSelector:
        agentpool: ""
        kubernetes.io/os: linux
      containers:
        - name: uc-container
          image: ":"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: test-release-uc-configmap
          env:
            # Secrets (either from KeyVault sync or k8s Secret)
            - name: UC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password
            - name: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password-truststore
            - name: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD_ENCRYPTED
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD_ENCRYPTED
            - name: UC_KEYMANAGER_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password-keystore
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # ~5 minutes

          readinessProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
---
# Source: uc-aks/templates/gateway.yaml
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: 'test-release-uac-gateway'
  namespace: "default"
spec:
  selector:
    istio: ingressgateway

  servers:
  # 80: (optional) only for web host if you want http->https redirect
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - ""

  # 443: WEB — Istio terminates TLS (no cipher list set; defaults apply)
  - port:
      number: 443
      name: https-web
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName:     # cert for akspresales.stonebranchdev.cloud
      minProtocolVersion: "TLSV1_2"
    hosts:
    - ""

  # 444: OMS — raw TLS passthrough to the pod
  - port:
      number: 444
      name: tls-oms
      protocol: TLS
    tls:
      mode: PASSTHROUGH
    hosts:
    - ""
  # 445: UDM Node
  - port:
      number: 445
      name: udm-tls
      protocol: TLS
    tls:
      mode: PASSTHROUGH
    hosts:
    - ""
---
# Source: uc-aks/templates/virtualservice-uc.yaml
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: 'test-release-uc-vs'
  namespace: "default"
spec:
  gateways: ["test-release-uac-gateway"]
  hosts: [""]
  http:
  - match:
    - uri: { prefix: "/uc/resources/metrics" }
    route:
    - destination:
        host: 'test-release-uc-service.default.svc.cluster.local'
        port:
          number: 80
  - match:
    - uri: { prefix: "/" }
    route:
    - destination:
        host: 'test-release-uc-service.default.svc.cluster.local'
        port:
          number: 80
