# Source: uc-aks/templates/oms-deployment.yaml
# templates/oms-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-oms
  namespace: default
  labels:
    app.kubernetes.io/name: uc-aks
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: 7.9.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uc-aks
      app.kubernetes.io/instance: test-release
      app.kubernetes.io/component: oms
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"  # Disable Istio sidecar for TLS PASSTHROUGH
      labels:
        app.kubernetes.io/name: uc-aks
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/component: oms
    spec:
      serviceAccountName: default
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      nodeSelector:
        agentpool: ""
        kubernetes.io/os: linux
      containers:
        - name: uac-oms
          image: ":"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7878
            - containerPort: 7887
          envFrom:
            - configMapRef:
                name: test-release-oms-configmap
          volumeMounts:
            - name: oms-storage
              mountPath: "/var/opt/universal/spool/oms"
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pgrep -x omssrv >/dev/null ||
                  pgrep -x ubroker >/dev/null ||
                  pgrep -x uagsrv >/dev/null ||
                  pgrep -x uemsrv >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pgrep -x omssrv >/dev/null ||
                  pgrep -x ubroker >/dev/null ||
                  pgrep -x uagsrv >/dev/null ||
                  pgrep -x uemsrv >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: oms-storage
          persistentVolumeClaim:
            claimName: 'test-release-oms-pvc'
