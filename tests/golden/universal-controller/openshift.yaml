# Source: universal-controller/templates/hostname-appendum.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: test-release-oms-route-cm-patch
  namespace: default
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: test-release-cm-patcher
      restartPolicy: Never
      containers:
        - name: patcher
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "-lc"]
          env:
            - name: NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE
              value: "test-release"
          args:
            - |
              set -e
              OMS_HOST=$(kubectl get route "${RELEASE}-oms-route" -n "$NS" -o jsonpath='{.spec.host}')
              UDM_HOST=$(kubectl get route "${RELEASE}-udm-route" -n "$NS" -o jsonpath='{.spec.host}')
              SNI_VALUE="445@${UDM_HOST}:${UDM_HOST}"
              kubectl patch configmap "${RELEASE}-oms-configmap" -n "$NS" \
                --type=merge \
                -p "{\"data\":{\"UAGTLSSNIHOSTNAME\":\"${SNI_VALUE}\"}}"
---
