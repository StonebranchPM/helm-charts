apiVersion: apps/v1
kind: Deployment
metadata:
  name: 'test-release-uc'
  namespace: default
  labels:
    app.kubernetes.io/name: ""
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: 
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: uc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ""
      app.kubernetes.io/instance: test-release
      app.kubernetes.io/component: uc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ""
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/component: uc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/uc/resources/metrics"
        sidecar.istio.io/inject: "true"
        checksum/config: 33552caccb112a874f8eca01fdab4dbc7b03431e767befdc5becd77f6ef63fbc
        checksum/passwords: f505355a4e554f0b10381e2c0c2f4b783be55863490b98629247b2d4880d92c0
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uc-container
          image: ":"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: test-release-uc-configmap
          env:
            - name: UC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password
            - name: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password-truststore
            - name: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD_ENCRYPTED
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD_ENCRYPTED
            - name: UC_KEYMANAGER_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-release-passwords
                  key: password-keystore
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /uc/resources/clusternode/healthcheck
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
