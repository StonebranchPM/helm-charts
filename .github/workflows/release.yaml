name: Release

# Trigger on chart changes pushed to main, or manually for bootstrap/recovery.
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'cr.yaml'
  workflow_dispatch:

permissions:
  contents: write     # push to gh-pages
  packages: write     # push OCI to ghcr.io
  id-token: write     # Cosign keyless OIDC signing

jobs:
  release:
    name: Package → GitHub Pages + OCI + sign
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.18.1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      # ── package both charts ───────────────────────────────────────────────
      - name: Resolve subchart dependencies
        run: helm dependency update charts/universal-controller

      - name: Package charts
        run: |
          mkdir -p /tmp/helm-packages
          helm package charts/universal-agent     --destination /tmp/helm-packages
          helm package charts/universal-controller --destination /tmp/helm-packages
          ls -lh /tmp/helm-packages/

      # ── build and push index to gh-pages ─────────────────────────────────
      - name: Build Helm repo index
        run: |
          helm repo index /tmp/helm-packages \
            --url https://stonebranchpm.github.io/helm-charts

      - name: Push packages + index to gh-pages
        run: |
          # Shallow-clone gh-pages so we can update it
          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/StonebranchPM/helm-charts.git" \
            /tmp/gh-pages-repo

          cp /tmp/helm-packages/*.tgz  /tmp/gh-pages-repo/
          cp /tmp/helm-packages/index.yaml /tmp/gh-pages-repo/

          cd /tmp/gh-pages-repo
          git add .
          # Only commit if something actually changed
          git diff --cached --quiet || \
            git commit -m "chore: release $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin gh-pages

      # ── OCI push + sign (non-blocking) ───────────────────────────────────
      - name: Log in to ghcr.io
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push OCI artifacts
        continue-on-error: true
        run: |
          for tgz in /tmp/helm-packages/*.tgz; do
            helm push "$tgz" oci://ghcr.io/stonebranchpm/charts
          done

      - name: Sign OCI artifacts (Cosign keyless)
        continue-on-error: true
        run: |
          for tgz in /tmp/helm-packages/*.tgz; do
            name=$(helm show chart    "$tgz" | awk '/^name:/    {print $2}')
            version=$(helm show chart "$tgz" | awk '/^version:/ {print $2}')
            cosign sign --yes "ghcr.io/stonebranchpm/charts/${name}:${version}"
          done
