name: CT Install (kind)

on:
  push:
    paths:
      - 'charts/**'
      - '.github/workflows/ci-install.yaml'
      - 'ct.yaml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/ci-install.yaml'
      - 'ct.yaml'

jobs:
  ct-install:
    name: ct install (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s:
          - v1.29.14
          - v1.30.10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.18.1'

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.7.0
        with:
          version: v3.12.0

      - name: Create kind cluster (${{ matrix.k8s }})
        uses: helm/kind-action@v1.10.0
        with:
          node_image: "kindest/node:${{ matrix.k8s }}"
          cluster_name: uac-ci

      - name: Resolve subchart dependencies
        run: helm dependency update charts/universal-controller

      - name: Run ct install (all changed charts)
        run: ct install --config ct.yaml --debug

      - name: Run ct install (force all — for PRs that only change CI)
        if: ${{ github.event_name == 'push' }}
        run: ct install --config ct.yaml --all --debug
