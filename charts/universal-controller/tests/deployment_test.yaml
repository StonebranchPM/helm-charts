suite: universal-controller deployment defaults
release:
  name: test-release
  namespace: stonebranch
# uc-deployment uses checksum annotations that include uc-configmap and uc-secret
templates:
  - uc-deployment.yaml
  - uc-configmap.yaml
  - uc-secret.yaml
  - keyvault.yaml

tests:
  - it: renders a Deployment for UC
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1

  - it: uses release name in UC metadata
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: test-release-uc

  - it: defaults to 1 replica
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: sets runAsNonRoot on UC pod
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: sets seccompProfile RuntimeDefault on UC pod
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: sets allowPrivilegeEscalation false on UC container
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: drops ALL capabilities on UC container
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: has startupProbe on UC
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: has readinessProbe on UC
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe

  - it: has livenessProbe on UC
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe

  - it: emits JAVA_TOOL_OPTIONS env var for JVM heap
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JAVA_TOOL_OPTIONS
            value: "-XX:MaxRAMPercentage=75"

  - it: sets UC_DB_PASSWORD from chart-managed secret by default
    template: uc-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UC_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-release-passwords
                key: password

  - it: respects uc.replicaCount override
    template: uc-deployment.yaml
    set:
      uc.replicaCount: 2
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: renders StatefulSet when native + statefulSet.enabled
    template: uc-deployment.yaml
    set:
      platform: native
      statefulSet.enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - isKind:
          of: StatefulSet

  - it: adds imagePullSecrets when set
    template: uc-deployment.yaml
    set:
      imagePullSecrets:
        - name: my-pull-secret
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-pull-secret

  - it: emits istio sidecar inject annotation on aks
    template: uc-deployment.yaml
    set:
      platform: aks
      istiosidecar.injection.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "true"
