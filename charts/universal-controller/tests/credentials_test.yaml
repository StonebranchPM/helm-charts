suite: universal-controller credentials and existingSecret
release:
  name: test-release
  namespace: stonebranch

tests:
  # ─── uc-secret rendering ─────────────────────────────────────────────────────

  - it: renders uc-secret by default (no existingSecret, no keyVault)
    template: uc-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: does NOT render uc-secret when credentials.existingSecret is set
    template: uc-secret.yaml
    set:
      credentials.existingSecret: my-uc-passwords
    asserts:
      - hasDocuments:
          count: 0

  - it: does NOT render uc-secret when keyVault.enabled
    template: uc-secret.yaml
    set:
      keyVault.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  # ─── secret key references in deployment ─────────────────────────────────────

  - it: UC_DB_PASSWORD references chart-managed secret by default
    template: uc-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UC_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-release-passwords
                key: password

  - it: UC_DB_PASSWORD references existingSecret when set
    template: uc-deployment.yaml
    set:
      credentials.existingSecret: my-uc-passwords
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UC_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-uc-passwords
                key: password

  - it: UC_DB_PASSWORD references keyvault secret when keyVault.enabled
    template: uc-deployment.yaml
    set:
      keyVault.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UC_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-release-keyvault-passwords
                key: password

  - it: respects custom passwordKey
    template: uc-deployment.yaml
    set:
      credentials.existingSecret: my-uc-passwords
      credentials.passwordKey: db-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UC_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-uc-passwords
                key: db-password

  # ─── uc-secret keys use configured key names ─────────────────────────────────

  - it: uc-secret uses default key names
    template: uc-secret.yaml
    asserts:
      - isNotNull:
          path: data.password
      - isNotNull:
          path: data["password-keystore"]
      - isNotNull:
          path: data["password-truststore"]
      - isNotNull:
          path: data["UC_TRUSTMANAGER_TRUSTSTORE_PASSWORD_ENCRYPTED"]
