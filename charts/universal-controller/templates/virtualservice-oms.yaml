{{- $isOCP := include "uc.isOpenShift" . | eq "true" -}}
{{- if and .Values.istio.enabled .Values.oms.enabled (not $isOCP) }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-tls-vs
  namespace: {{ .Release.Namespace }}
spec:
  gateways: ["{{ .Release.Name }}-uac-gateway"]
  hosts: [{{ .Values.istio.host | quote }}]
  tls:
    - match:
        - port: {{ .Values.istio.omsConnectionPort }}
          sniHosts: [{{ .Values.istio.host | quote }}]
      route:
        - destination:
            host: '{{ .Release.Name }}-oms-service.{{ .Release.Namespace }}.svc.cluster.local'
            port:
              number: 7878
          weight: 100
    - match:
        - port: {{ .Values.istio.udmConnectionPort }}
          sniHosts: [{{ .Values.istio.host | quote }}]
      route:
        - destination:
            host: '{{ .Release.Name }}-oms-service.{{ .Release.Namespace }}.svc.cluster.local'
            port:
              number: 7887
          weight: 100
{{- end }}
