{{- $isOCP := include "uc.isOpenShift" . | eq "true" -}}
{{- if and $isOCP .Values.oms.enabled .Values.route.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cm-patcher
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cm-patcher
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cm-patcher
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cm-patcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cm-patcher
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-oms-route-cm-patch
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-cm-patcher
      restartPolicy: Never
      containers:
        - name: patcher
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "-lc"]
          env:
            - name: NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE
              value: {{ .Release.Name | quote }}
          args:
            - |
              set -e
              OMS_HOST=$(kubectl get route "${RELEASE}-oms-route" -n "$NS" -o jsonpath='{.spec.host}')
              UDM_HOST=$(kubectl get route "${RELEASE}-udm-route" -n "$NS" -o jsonpath='{.spec.host}')
              SNI_VALUE="{{ .Values.istio.udmConnectionPort | default 445 }}@${UDM_HOST}:${UDM_HOST}"
              kubectl patch configmap "${RELEASE}-oms-configmap" -n "$NS" \
                --type=merge \
                -p "{\"data\":{\"UAGTLSSNIHOSTNAME\":\"${SNI_VALUE}\"}}"
{{- end }}
