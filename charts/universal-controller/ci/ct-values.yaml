# kind CI values — used by ct install in .github/workflows/ci-install.yaml
# These values allow helm install to succeed in kind without real Stonebranch images.
# Purpose: verify that K8s manifests are accepted by the API server.
# Application functionality is NOT tested here; use make smoke for live cluster tests.
platform: native

uc:
  image:
    repository: busybox
    tag: "stable"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

oms:
  enabled: true
  image:
    repository: busybox
    tag: "stable"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  persistence:
    enabled: false

database:
  host: "postgres.ci-test.svc.cluster.local"
  port: 5432
  name: uc_ci
  type: postgresql
  user: ucadmin

credentials:
  dbPassword: "changeme-ci"
  keystorePassword: "changeme-ci"
  truststorePassword: "changeme-ci"
  truststorePasswordEncrypted: "changeme-ci"

jvm:
  maxRamPercentage: 50.0

# Disable helm test hooks — application doesn't run with busybox
test:
  enabled: false

# Disable probes that require a running Tomcat — kind pods stay in ImagePullBackOff
# Install uses --wait=false so pod readiness is not checked
ucProbes:
  startup:
    failureThreshold: 1
    periodSeconds: 5
  liveness:
    failureThreshold: 1
    periodSeconds: 5
  readiness:
    failureThreshold: 1
    periodSeconds: 5
