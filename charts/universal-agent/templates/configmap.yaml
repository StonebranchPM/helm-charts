{{- $isAKS := include "ua.isAKS" . | eq "true" -}}
{{- $isOCP := include "ua.isOpenShift" . | eq "true" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-ua-configmap'
  namespace: {{ .Release.Namespace }}
data:
  # SNI hostname: only emitted when it has a value. UA fails with UNV0103E
  # if UAGTLSSNIHOSTNAME is defined but empty, so the key must be absent instead.
  {{- if $isAKS }}
  {{- with .Values.istio.host }}
  UAGTLSSNIHOSTNAME: {{ . | quote }}
  {{- end }}
  {{- else }}
  {{- include "uac.emitIfSet" (dict "name" "UAGTLSSNIHOSTNAME" "value" .Values.uaConfig.uagtlssnihostname) | nindent 2 }}
  {{- end }}
  UAGTRANSIENT: "yes"

  # ------- UAG -------
  {{- include "uac.emitIfSet" (dict "name" "UAGAGENTCLUSTERS" "value" .Values.uaConfig.uagagentclusters) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGBUSINESSSERVICES" "value" .Values.uaConfig.businessservices) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGEXTACCEPTLIST" "value" .Values.uaConfig.extensionacceptlist) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGEXTCANCELTIMEOUT" "value" .Values.uaConfig.extensioncanceltimeout) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGEXTDEPLOYONREG" "value" .Values.uaConfig.extensiondeployonregistration) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGEXTPYTHONLIST" "value" .Values.uaConfig.extensionpythonlist) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGNETNAME" "value" .Values.uaConfig.netname) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGOMSSERVERS" "value" .Values.uaConfig.omsServers) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGPRCCANCELTIMEOUT" "value" .Values.uaConfig.processcanceltimeout) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGAUTOSTART" "value" .Values.uaConfig.uagAutostart) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGLOGLVL" "value" .Values.uaConfig.uagLoglvl) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "UAGLEVEL" "value" .Values.uaConfig.uagLevel) | nindent 2 }}

  # ------- OMS -------
  {{- include "uac.emitIfSet" (dict "name" "OMSAUTOSTART" "value" .Values.uaConfig.omsAutostart) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSCODEPAGE" "value" .Values.uaConfig.codepage) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSDNSCACHETIMEOUT" "value" .Values.uaConfig.omsDNSCacheTimeout) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSINDEXCACHESIZE" "value" .Values.uaConfig.omsIndexCacheSize) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSMAXCONNECTIONS" "value" .Values.uaConfig.omsMaxConnections) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSMAXDATAFILESIZE" "value" .Values.uaConfig.maxfilesize) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSMAXMSGSIZE" "value" .Values.uaConfig.maxmessagesize) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSMAXSSLPROTOCOL" "value" .Values.uaConfig.omsMaxSSLProtocol) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSLANG" "value" .Values.uaConfig.omsLanguage) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSMINSSLPROTOCOL" "value" .Values.uaConfig.omsMinSSLProtocol) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSMSGCHUNKSIZE" "value" .Values.uaConfig.chunksize) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSMSGCLEANUPINTERVAL" "value" .Values.uaConfig.omsMSGCleanupInterval) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSMSGDATAFLUSHINT" "value" .Values.uaConfig.omsMSGDataFlushInt) | nindent 2 }}

  # ------- Keys below are in values.yaml but were missing from the original template.
  # ------- VERIFY the env var names against the UA docs before relying on them.
  {{- include "uac.emitIfSet" (dict "name" "OMSMSGSUPPRESSIONLIST" "value" .Values.uaConfig.omsMSGSuppressionList) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSREQUIRESSL" "value" .Values.uaConfig.omsRequiresSSL) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSSERVICEBACKLOG" "value" .Values.uaConfig.omsServiceBacklog) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSSVCIADDR" "value" .Values.uaConfig.omsSVCIAddr) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSSVCIPORT" "value" .Values.uaConfig.omsSVCIPort) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSSERVICETIMEOUT" "value" .Values.uaConfig.omsServiceTimeout) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "SSLCIPHERLIST" "value" .Values.uaConfig.sslcipherlist) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "SSLCIPHERSUITES" "value" .Values.uaConfig.sslciphersuites) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSTRACEFILELINES" "value" .Values.uaConfig.omstracefilelines) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OMSTRACETABLE" "value" .Values.uaConfig.omstracetable) | nindent 2 }}

  # ------- OTEL -------
  {{- include "uac.emitIfSet" (dict "name" "OTELENABLETRACING" "value" .Values.uaConfig.otelenabletracing) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELEXPORTMETRICS" "value" .Values.uaConfig.otelexportmetrics) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELMETRICSENDPOINT" "value" .Values.uaConfig.otelmetricsendpoint) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELMETRICSEXPORTINTERVAL" "value" .Values.uaConfig.otelmetricsexportinterval) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELSERVICENAME" "value" .Values.uaConfig.otelservicename) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELSSLCACERTPATH" "value" .Values.uaConfig.otelsslcacertpath) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELSSLCLIENTCERTPATH" "value" .Values.uaConfig.otelsslclientcertpath) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELSSLCLIENTKEYPATH" "value" .Values.uaConfig.otelsslclientkeypath) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELSSLINSECURESKIPVERIFY" "value" .Values.uaConfig.otelsslinsecureskipverify) | nindent 2 }}
  {{- include "uac.emitIfSet" (dict "name" "OTELTRACEENDPOINT" "value" .Values.uaConfig.oteltraceendpoint) | nindent 2 }}
