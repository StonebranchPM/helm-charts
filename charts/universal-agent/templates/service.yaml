{{- $isOCP := include "ua.isOpenShift" . | eq "true" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-udm-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "universal-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ua-service
spec:
  selector:
    {{- include "universal-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ua
  ports:
    - name: udm
      port: 7887
      targetPort: 7887
      protocol: TCP
    {{- if not $isOCP }}
    - name: oms
      port: 7878
      targetPort: 7878
      protocol: TCP
    {{- end }}
---
{{- if and $isOCP (eq .Values.uaConfig.omsAutoStart "yes") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-oms-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "universal-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ua-oms-service
spec:
  selector:
    {{- include "universal-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ua
  ports:
    - name: oms
      port: 7878
      targetPort: 7878
      protocol: TCP
{{- end }}
