{{- $isOCP := include "ua.isOpenShift" . | eq "true" -}}
{{- if $isOCP }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-udm-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "universal-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ua-route
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  to:
    kind: Service
    name: {{ .Release.Name }}-udm-service
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: None
{{- end }}
