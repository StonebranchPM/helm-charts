{{- $isOCP := include "ua.isOpenShift" . | eq "true" -}}
{{- if and $isOCP .Values.tlssnihostnameref.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-uasni-configmap'
  namespace: {{ .Release.Namespace }}
data:
  UAGTLSSNIHOSTNAME: {{ default "" .Values.uaConfig.uagtlssnihostname | quote }}
{{- end }}
